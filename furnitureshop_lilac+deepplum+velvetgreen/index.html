<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELLUTO — Deep Seats | Made to Order in Milan</title>
  <meta name="description" content="VELLUTO is a Milan made-to-order velvet sofa workshop. Four modular silhouettes, 14 Milanese cotton and mohair velvets, 10 weeks to make.">
  <meta name="theme-color" content="#C9BBD8">
  <meta property="og:title" content="VELLUTO — Deep Seats">
  <meta property="og:description" content="Made to order in Milan. 14 velvets. 10 weeks to make.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C9BBD8'/%3E%3Crect x='5' y='12' width='22' height='11' rx='5' fill='%2352AE4C'/%3E%3Cpath d='M8 10h16v4H8z' fill='%233F0820'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <div class="header-left">
        <button
          type="button"
          class="icon-btn menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="nav-drawer"
          aria-label="Open workshop menu"
        >
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true">
            <path d="M1 2h20M1 8h20M1 14h20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <a href="#top" class="brand" aria-label="VELLUTO Home">VELLUTO</a>
      </div>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#sofas" class="nav-link">SOFAS</a>
        <a href="#velvets" class="nav-link">VELVETS</a>
        <a href="#workshop" class="nav-link">WORKSHOP</a>
        <a href="#stores" class="nav-link">STORES</a>
      </nav>

      <div class="header-actions">
        <button
          type="button"
          class="icon-btn"
          id="search-toggle"
          aria-expanded="false"
          aria-controls="search-drawer"
          aria-label="Search sofas and velvets"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13.6 13.6L18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <button
          type="button"
          class="icon-btn bag-trigger"
          id="bag-toggle"
          aria-expanded="false"
          aria-controls="bag-drawer"
          aria-label="Open order bag"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.5 6.5h11l1 10.5h-13l1-10.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M7.25 6.5V5a2.75 2.75 0 0 1 5.5 0v1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="bag-count" id="bag-count" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero Poster: 60% Lilac / 30% Deep Plum / 10% Velvet Green -->
    <section class="hero" id="top" aria-label="VELLUTO Deep Seats">
      <div class="hero-media" aria-hidden="true">
        <img
          src="./assets/velluto-hero.jpg"
          alt=""
          class="hero-photo"
          width="1920"
          height="1080"
        >
        <div class="hero-lilac-fade"></div>
      </div>

      <div class="hero-inner">
        <div class="hero-copy">
          <h1 class="hero-title">
            <span>DEEP</span>
            <span>SEATS</span>
          </h1>

          <ul class="hero-specs" aria-label="Workshop specifications">
            <li>MADE TO ORDER IN MILAN</li>
            <li>14 VELVETS</li>
            <li>10 WEEKS TO MAKE</li>
          </ul>

          <a href="#sofas" class="hero-cta">
            <span>SHOP SOFAS</span>
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" aria-hidden="true">
              <path d="M1 7h15M11 2l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </section>
