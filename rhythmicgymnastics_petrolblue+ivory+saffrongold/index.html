<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMO LISBOA — RIBBON FINALS</title>
  <meta name="description" content="Ritmo Lisboa Ribbon Finals, 15 to 17 May at Pavilhão Atlântico. Programme, apparatus finalists, venue seating, and tickets from €18.">
  <meta name="theme-color" content="#002D37">
  <meta property="og:title" content="RITMO LISBOA — RIBBON FINALS">
  <meta property="og:description" content="Three days of international rhythmic gymnastics finals in Petrol Blue, Ivory, and Saffron Gold.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23002D37'/%3E%3Cpath d='M5 22 C11 8 21 24 27 10' fill='none' stroke='%23F7A724' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23FEF0DD'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#top" class="brand" aria-label="Ritmo Lisboa Home">
        <span>RITMO LISBOA</span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#programme" class="nav-link">PROGRAMME</a>
        <a href="#athletes" class="nav-link">ATHLETES</a>
        <a href="#venue" class="nav-link">VENUE</a>
        <a href="#tickets" class="nav-link">TICKETS</a>
      </nav>

      <div class="header-actions">
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="mobile-drawer"
          aria-label="Open navigation menu"
        >
          <span class="menu-bars" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>

    <div class="mobile-drawer" id="mobile-drawer" hidden>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#programme" class="mobile-nav-link">PROGRAMME</a>
        <a href="#athletes" class="mobile-nav-link">ATHLETES</a>
        <a href="#venue" class="mobile-nav-link">VENUE</a>
        <a href="#tickets" class="mobile-nav-link">TICKETS</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero Poster: 60% Petrol Blue / 30% Ivory / 10% Saffron Gold -->
    <section class="hero" id="top" aria-label="Ritmo Lisboa Ribbon Finals Hero">
      <div class="hero-stage-media" aria-hidden="true">
        <img
          src="./assets/ribbon-gymnast.jpg"
          alt=""
          class="hero-gymnast-img"
          width="1280"
          height="720"
        >
        <div class="hero-stage-vignette"></div>
      </div>

      <div class="hero-overlay">
        <div class="hero-top-meta">
          <span class="hero-dates">15 TO 17 MAY</span>
        </div>

        <div class="hero-title-ribbon-wrap">
          <h1 class="hero-title" aria-label="RIBBON FINALS">
            <span class="title-ribbon">RIBBON</span>
            <span class="title-finals">FINALS</span>
          </h1>
        </div>

        <div class="hero-middle-cta">
          <a href="#tickets" class="circle-cta">
            <span class="circle-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="circle-label">BOOK TICKETS</span>
          </a>
        </div>

        <div class="hero-bottom-price">
          <span>TICKETS</span>
          <span>FROM €18</span>
        </div>
      </div>
    </section>

    
  </main>
</body>
</html>
