<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASEMENT SEVEN — Late Sets</title>
  <meta name="description" content="Basement Seven is an intimate seven-night jazz cellar in Soho hosting three live sets nightly at 21:30, 23:00, and 00:30.">
  <meta name="theme-color" content="#F8DBC1">
  <meta property="og:title" content="BASEMENT SEVEN — Late Sets">
  <meta property="og:description" content="Seven nights a week. Doors 21:00. Three live sets nightly in Riso Teal, Cream Paper, and Fluorescent Pink.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F8DBC1'/%3E%3Crect y='18' width='32' height='14' fill='%231D646C'/%3E%3Ccircle cx='22' cy='11' r='6' fill='%23EA4F88'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#top" class="brand" aria-label="Basement Seven Home">
        <span>BASEMENT SEVEN</span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#tonight" class="nav-link">Tonight</a>
        <a href="#programme" class="nav-link">Programme</a>
        <a href="#membership" class="nav-link">Membership</a>
        <a href="#find-us" class="nav-link">Find us</a>
      </nav>

      <div class="header-actions">
        <a href="#tickets" class="tickets-cta" id="header-tickets-cta">Get tickets</a>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="mobile-drawer"
          aria-label="Open navigation menu"
        >
          <span class="menu-bars" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>

    <div class="mobile-drawer" id="mobile-drawer" hidden>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#tonight" class="mobile-nav-link">Tonight</a>
        <a href="#programme" class="mobile-nav-link">Programme</a>
        <a href="#membership" class="mobile-nav-link">Membership</a>
        <a href="#find-us" class="mobile-nav-link">Find us</a>
        <a href="#tickets" class="mobile-nav-cta">Get tickets</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero Poster: 60% Cream Paper / 30% Riso Teal / 10% Fluorescent Pink -->
    <section class="hero" id="top" aria-label="Basement Seven Late Sets Hero">
      <div class="hero-riso-field" aria-hidden="true"></div>

      <div class="hero-art-wrap" aria-hidden="true">
        <img
          src="./assets/sax-riso.jpg"
          alt=""
          class="hero-sax-img"
          width="1280"
          height="720"
        >
        <div class="hero-pink-overprint"></div>
      </div>

      <div class="hero-content">
        <div class="hero-headline-row">
          <h1 class="hero-title">Late Sets</h1>
        </div>

        <div class="hero-lower">
          <div class="hero-schedule-slab">
            <div class="hero-sets-bar">
              <span>Set 1 21:30 · Set 2 23:00 · Set 3 00:30</span>
            </div>
            <div class="hero-hours-block">
              <p>Seven nights a week</p>
              <p>Doors 21:00</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    
  </main>
</body>
</html>
