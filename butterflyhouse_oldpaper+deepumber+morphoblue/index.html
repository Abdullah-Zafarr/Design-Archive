<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINNAEA — The Butterfly House</title>
  <meta name="description" content="Linnaea is a living tropical butterfly conservatory housing 2,000 free-flying butterflies at 26 °C year-round, open daily from 10 to 5.">
  <meta name="theme-color" content="#EBC99D">
  <meta property="og:title" content="LINNAEA — The Butterfly House">
  <meta property="og:description" content="2,000 free-flying butterflies across four tropical glasshouse zones. 26 °C all year, open daily 10 to 5.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#top" class="brand" aria-label="LINNAEA Home">
        <span>LINNAEA</span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#visit" class="nav-link">Visit</a>
        <a href="#whats-on" class="nav-link">What's on</a>
        <a href="#collections" class="nav-link">Collections</a>
        <a href="#members" class="nav-link">Members</a>
      </nav>

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="mobile-drawer"
        aria-label="Open navigation menu"
      >
        <span class="menu-bars" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
      </button>
    </div>

    <div class="mobile-drawer" id="mobile-drawer" hidden>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#visit" class="mobile-nav-link">Visit</a>
        <a href="#whats-on" class="mobile-nav-link">What's on</a>
        <a href="#collections" class="mobile-nav-link">Collections</a>
        <a href="#members" class="mobile-nav-link">Members</a>
        <a href="#tickets" class="mobile-nav-cta">Book tickets</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero Poster: 60% Old Paper / 30% Deep Umber / 10% Morpho Blue -->
    <section class="hero" id="top" aria-label="LINNAEA The Butterfly House Hero">
      <div class="hero-media" aria-hidden="true">
        <img
          src="./assets/linnaea-hero.jpg"
          alt=""
          class="hero-butterfly-img"
          width="1920"
          height="1080"
        >
      </div>

      <div class="hero-inner">
        <div class="hero-eyebrow-group">
          <p class="hero-eyebrow">THE BUTTERFLY<br>HOUSE</p>
          <span class="hero-rule" aria-hidden="true"></span>
        </div>

        <div class="hero-lockup">
          <h1 class="hero-title">
            <span class="hero-count">2,000</span>
            <span class="hero-subject">butterflies</span>
          </h1>

          <p class="hero-caption">26 °C ALL YEAR • OPEN DAILY 10 TO 5</p>

          <a href="#tickets" class="hero-cta">
            <span class="hero-cta-circle" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2.5 8h10.5M9.5 4.5L13 8l-3.5 3.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="hero-cta-label">BOOK TICKETS</span>
          </a>
        </div>
      </div>
    </section>
