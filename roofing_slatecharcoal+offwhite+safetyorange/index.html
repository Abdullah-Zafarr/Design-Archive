<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ridgeline — Roofs built for every storm</title>
  <meta name="description" content="Architectural roofing across Bristol and Yorkshire. Welsh slate, standing-seam zinc, and clay plain tile systems from free drone survey to 25-year guaranteed completion." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a href="#top" class="brand-lockup" aria-label="Ridgeline home">
        <svg class="brand-mark" width="24" height="18" viewBox="0 0 24 18" fill="none" aria-hidden="true">
          <path d="M2.5 14L12 4.5L21.5 14" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-name">Ridgeline</span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#services" class="nav-link">Services</a>
        <a href="#work" class="nav-link">Our work</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <a href="#contact" class="btn btn-offwhite header-cta">Free survey</a>
        <button
          type="button"
          class="menu-toggle"
          id="menuToggle"
          aria-expanded="false"
          aria-controls="mobileDrawer"
          aria-label="Open navigation menu"
        >
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 6H17M3 10H17M3 14H17" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <div class="mobile-drawer" id="mobileDrawer" hidden>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#services" class="mobile-link">Services</a>
        <a href="#work" class="mobile-link">Our work</a>
        <a href="#about" class="mobile-link">About</a>
        <a href="#contact" class="mobile-link">Contact</a>
        <a href="#contact" class="btn btn-orange mobile-cta">Free survey</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="heroHeading">
      <div class="hero-media" aria-hidden="true">
        <img
          src="./assets/ridgeline-roof.jpg"
          alt="Dark slate roof peak beneath a stormy charcoal sky with warm ridge lighting"
          class="hero-photo"
          width="1600"
          height="900"
        />
        <div class="hero-scrim"></div>
      </div>

      <div class="wrap hero-inner">
        <div class="hero-stage">
          <div class="hero-pill hero-pill--left">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="6.2" r="3.7" stroke="#FF6B1A" stroke-width="1.5" />
              <path d="M5.8 9.4V14.2L8 12.9L10.2 14.2V9.4" stroke="#FF6B1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="tabular">25 yr guarantee</span>
          </div>

          <div class="hero-center">
            <h1 id="heroHeading" class="hero-title">
              Roofs built for<br />
              <em class="hero-serif">every</em> storm.
            </h1>
            <p class="hero-sub">Professional roofing, from survey to completion.</p>
            <div class="hero-ctas">
              <a href="#contact" class="btn btn-orange">Book a survey</a>
              <a href="#work" class="btn btn-outline-hero">Our work</a>
            </div>
          </div>

          <div class="hero-pill hero-pill--right">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 2.4L13.8 5.6L8 8.8L2.2 5.6L8 2.4Z" stroke="#FF6B1A" stroke-width="1.45" stroke-linejoin="round" />
              <path d="M2.2 8.4L8 11.6L13.8 8.4" stroke="#FF6B1A" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M2.2 11.2L8 14.4L13.8 11.2" stroke="#FF6B1A" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="tabular">1,200+ roofs</span>
          </div>
        </div>

        <div class="hero-telemetry" aria-label="Live survey and installation telemetry">
          <div class="telemetry-panel telemetry-panel--status">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="telemetry-status-text tabular" id="heroSurveyStatus">Survey booked · Tue 9:00</span>
          </div>

          <div class="telemetry-panel telemetry-panel--progress">
            <div class="telemetry-progress-head">
              <span class="telemetry-progress-label tabular">Re-roof · 72%</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="Current re-roof completion">
              <div class="progress-fill" style="width: 72%"></div>
            </div>
          </div>

          <div class="telemetry-panel telemetry-panel--thumb" aria-hidden="true">
            <img
              src="./assets/ridgeline-roof.jpg"
              alt=""
              class="telemetry-thumb-img"
              width="480"
              height="160"
            />
          </div>
        </div>
      </div>
    </section>
