<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATELIER RUO — Fired twice</title>
  <meta name="description" content="Atelier Ruo is a stoneware ceramics studio crafting Cone 10 wheel-thrown vessels and hosting weekend throwing and turquoise copper-glaze classes.">
  <meta name="theme-color" content="#D0BCAC">
  <meta property="og:title" content="ATELIER RUO — Fired twice">
  <meta property="og:description" content="Cone 10 stoneware vessels, turquoise copper glazes, and weekend wheel classes from €85.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23D0BCAC'/%3E%3Cpath d='M8 10h16v6c0 5-3.5 9-8 9s-8-4-8-9v-6z' fill='%23461C0C'/%3E%3Cpath d='M8 10h16v4c-2 2-4 1-6 4s-4-2-6 1-4-3-4-5v-4z' fill='%23269991'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="#top" class="brand" aria-label="Atelier Ruo Home">
        <span>ATELIER RUO</span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#shop" class="nav-link">Shop</a>
        <a href="#classes" class="nav-link">Classes</a>
        <a href="#studio" class="nav-link">Studio</a>
        <a href="#journal" class="nav-link">Journal</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="bag-trigger" id="bag-toggle" aria-expanded="false" aria-controls="bag-drawer">
          <span>Bag</span>
          <span class="bag-count" id="bag-count">0</span>
        </button>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="mobile-drawer"
          aria-label="Open navigation menu"
        >
          <span class="menu-bars" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>

    <div class="mobile-drawer" id="mobile-drawer" hidden>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#shop" class="mobile-nav-link">Shop</a>
        <a href="#classes" class="mobile-nav-link">Classes</a>
        <a href="#studio" class="mobile-nav-link">Studio</a>
        <a href="#journal" class="mobile-nav-link">Journal</a>
        <a href="#book" class="mobile-nav-cta">Book a class</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero Poster: 60% Raw Clay / 30% Iron Brown / 10% Turquoise -->
    <section class="hero" id="top" aria-label="Atelier Ruo Fired twice Hero">
      <div class="hero-media" aria-hidden="true">
        <img
          src="./assets/ceramic-glaze.jpg"
          alt=""
          class="hero-glaze-img"
          width="1280"
          height="720"
        >
        <div class="hero-clay-vignette"></div>
      </div>

      <div class="hero-inner">
        <div class="hero-stack">
          <h1 class="hero-title">
            <span>Fired</span>
            <span>twice</span>
          </h1>

          <a href="#classes" class="hero-pill-cta">
            <span>Book a class</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>

        <div class="hero-footer-bar">
          <span>WEEKEND CLASSES FROM €85</span>
          <span>CONE 10 STONEWARE</span>
        </div>
      </div>
    </section>

    
  </main>
</body>
</html>
